services:
  - type: web
    name: athena-pm
    runtime: node
    plan: free
    buildCommand: npm install && npx expo export -p web
    startCommand: npx expo serve dist --port $PORT
    envVars:
      - key: CLICKUP_API_TOKEN
        sync: false
      - key: CLIENT_LINK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
