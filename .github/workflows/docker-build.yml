name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temporary diagnostic: reproduce the exact "npm ci" the Dockerfile runs
      # inside the same base image, but directly on the runner (not through
      # buildx), so a failure's real npm error can be surfaced as a check
      # annotation — raw job logs need admin rights we don't have, but
      # annotations (via the `::error::` workflow command) are readable
      # through the public Checks API. Safe to remove once the build is green
      # again.
      - name: Diagnose npm ci in node:20-slim
        run: |
          set +e
          docker run --rm -v "$PWD":/app -w /app node:20-slim sh -c "npm ci" > /tmp/npmci.log 2>&1
          CODE=$?
          echo "--- npm ci diagnostic output (exit $CODE) ---"
          cat /tmp/npmci.log
          if [ $CODE -ne 0 ]; then
            TAIL=$(tail -c 3500 /tmp/npmci.log | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::NPM CI FAILED (exit $CODE): $TAIL"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/athena-pm:latest
          build-args: |
            EXPO_PUBLIC_GOOGLE_CLIENT_ID=842593789503-t5p1u7l8ps6cvk45iv0up0o1n6ufism7.apps.googleusercontent.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
